name: RF-Co-Pilot CI/CD

on:
  push:
    branches: [feat/v0.4-vault-grounded-loop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Verify build output
        run: |
          test -f dist/index.html || exit 1
          test -f dist/server.cjs || exit 1
          echo "✅ Build artifacts verified"

      - name: Check for TypeScript errors
        run: npx tsc --noEmit || true

      - name: Verify no secrets in code
        run: |
          if grep -r "sk-" src/ server.ts 2>/dev/null; then
            echo "❌ Potential API key found in source code"
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sesi 1 tests
        run: node tests/run_sesi1.mjs
        env:
          PORT: 3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results_sesi1.json
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/feat/v0.4-vault-grounded-loop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Create release package
        run: |
          tar -czf rf-copilot-v$(node -p "require('./package.json').version").tar.gz \
            dist/ \
            scripts/ \
            vault/ \
            package.json \
            README.md \
            .env.example

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: rf-copilot-v*.tar.gz
          retention-days: 30
